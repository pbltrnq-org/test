[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skeleton"
version = "0.1.0"
description = "A skeleton Python project."
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = ["--cov", "--cov-report=xml"]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["skeleton"]

[tool.coverage.report]
show_missing = true

[tool.coverage.xml]
output = "coverage.xml"
